<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Programar NFC</title>

<!-- ================================
     BIBLIOTECA PARA GENERAR CÓDIGOS QR
     (QRCode.js: dibuja un código QR dentro de un elemento de la página)
================================ -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #111111;
    padding: 30px;
    margin: 0;
}


.card {

    background: #ffffff;
    max-width: 400px;
    margin: auto;
    padding: 30px 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.35);

}


.logo {

    width: 150px;
    margin-bottom: 20px;

}


h2 {

    margin-top: 0;
    color: #111111;
    font-size: 24px;

}


.nombre {

    font-size: 25px;
    font-weight: bold;
    color: #111111;
    margin-top: 20px;

}


.id {

    margin-top: 10px;
    color: #555555;
    font-size: 18px;

}


button {

    margin-top: 30px;
    padding: 16px 35px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #D4A017;
    color: #000000;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,.25);

}


button:active {

    transform: scale(.97);

}

/* Botón del QR, en un color distinto para diferenciarlo del de NFC */
#btnQR {

    background: #2d7dd2;
    color: #ffffff;

}


.estado {

    margin-top: 25px;
    font-size: 18px;
    font-weight: bold;
    color: #111111;

}

/* Vista previa del QR generado, dentro de la tarjeta */
#previaQR {

    display: none;
    margin-top: 25px;

}

#previaQR img {

    width: 220px;
    height: 220px;
    border: 1px solid #dddddd;
    border-radius: 10px;

}


</style>
</head>


<body>


<div class="card">

<img src="https://raw.githubusercontent.com/americordzn-karate/asistencia/main/Escudo%20Circulo%20PNG.png" class="logo">

<h2>
PROGRAMAR TARJETA NFC
</h2>


<div class="nombre" id="nombre">
</div>


<div class="id" id="idAlumno">
</div>


<button onclick="grabarNFC()">
PROGRAMAR TARJETA NFC
</button>


<div class="estado" id="estado">
Esperando...
</div>

    <button id="regresar" onclick="regresarApp()" style="display:none;">
REGRESAR A APP
</button>

<!-- ================================
     BOTÓN Y VISTA PREVIA PARA GENERAR EL QR
================================ -->

<button id="btnQR" onclick="generarQR()">
GENERAR QR PARA IMPRIMIR
</button>

<div id="previaQR">
    <img id="imagenPreviaQR" alt="Código QR generado">
</div>

<!-- Elemento oculto donde QRCode.js dibuja el código QR original -->
<div id="qrOculto" style="display:none;"></div>

<!-- Lienzo oculto donde se compone la imagen final de 800x800 con el nombre -->
<canvas id="lienzoQR" width="800" height="800" style="display:none;"></canvas>

</div>



<script>


// Obtener datos enviados desde AppSheet

const parametros = new URLSearchParams(window.location.search);


const idAlumno = parametros.get("id");

const nombre = parametros.get("nombre");



document.getElementById("nombre").innerHTML =
nombre || "Sin nombre";


document.getElementById("idAlumno").innerHTML =
"ID: " + idAlumno;



async function grabarNFC(){


    if(!("NDEFReader" in window)){


        document.getElementById("estado").innerHTML =
        "❌ Web NFC no disponible";


        return;

    }



    try{


        document.getElementById("estado").innerHTML =
        "📡 Acerque la tarjeta...";



        const ndef = new NDEFReader();



        await ndef.write({

            records:[

                {

                    recordType:"text",

                    data:idAlumno

                }

            ]

        });



        navigator.vibrate(200);



        document.getElementById("estado").innerHTML =
        "✅ Tarjeta programada";
document.getElementById("regresar").style.display = "inline-block";

    }


    catch(error){


        document.getElementById("estado").innerHTML =
        "❌ Error: " + error.message;


    }


}

    function regresarApp(){

    window.location.href = "https://www.appsheet.com/start/ebc837fc-900c-4559-ba3e-ca02b965e134";

}

/*
==================================================
GENERAR CÓDIGO QR PARA IMPRIMIR
==================================================
Este bloque toma el mismo idAlumno que ya se usa para
programar la tarjeta NFC y genera, a partir de él, una
imagen JPG de 800x800 píxeles con el código QR arriba
y el nombre del alumno escrito debajo, lista para
descargar e imprimir.
==================================================
*/

const qrOculto = document.getElementById("qrOculto");
const lienzoQR = document.getElementById("lienzoQR");
const contextoLienzo = lienzoQR.getContext("2d");
const previaQR = document.getElementById("previaQR");
const imagenPreviaQR = document.getElementById("imagenPreviaQR");

function generarQR(){

    if(!idAlumno){

        alert("No se encontró el ID del alumno en el enlace");
        return;

    }

    // Limpiar cualquier QR generado previamente en este elemento oculto
    qrOculto.innerHTML = "";

    // Generar el código QR a alta resolución (400x400) usando el ID del alumno.
    // Se genera más grande de lo que se verá para que no pierda nitidez
    // al componerlo dentro de la imagen final de 800x800.
    new QRCode(qrOculto, {

        text: idAlumno,
        width: 560,
        height: 560,
        correctLevel: QRCode.CorrectLevel.H

    });

    // QRCode.js tarda un instante en dibujar la imagen internamente,
    // por lo que se espera un momento breve antes de leerla.
    setTimeout(componerImagenFinal, 250);

}

function componerImagenFinal(){

    // Se usa el <canvas> que dibuja QRCode.js, no el <img>: el canvas está
    // listo de inmediato, mientras que el <img> puede tardar una fracción
    // de segundo en terminar de cargarse y dejaría el QR en blanco.
    const imgQR = qrOculto.querySelector("canvas") || qrOculto.querySelector("img");

    if(!imgQR){

        alert("No se pudo generar el código QR, intenta de nuevo");
        return;

    }

    // Fondo blanco de 800x800, listo para imprimir
    contextoLienzo.fillStyle = "#ffffff";
    contextoLienzo.fillRect(0, 0, 800, 800);

    // Dibujar el código QR centrado horizontalmente, en la parte superior
    const tamanoQR = 560;
    const margenX = (800 - tamanoQR) / 2;
    const margenYArriba = 70;

    contextoLienzo.drawImage(imgQR, margenX, margenYArriba, tamanoQR, tamanoQR);

    // Escribir el nombre del alumno debajo del QR
    const textoNombre = nombre || "Sin nombre";

    contextoLienzo.fillStyle = "#111111";
    contextoLienzo.textAlign = "center";
    contextoLienzo.font = "bold 42px Arial";

    const posicionYTexto = margenYArriba + tamanoQR + 70;

    // Si el nombre es muy largo, se reduce el tamaño de letra para que quepa
    let tamanoLetra = 42;
    contextoLienzo.font = "bold " + tamanoLetra + "px Arial";

    while(contextoLienzo.measureText(textoNombre).width > 720 && tamanoLetra > 20){

        tamanoLetra -= 2;
        contextoLienzo.font = "bold " + tamanoLetra + "px Arial";

    }

    contextoLienzo.fillText(textoNombre, 400, posicionYTexto);

    // Convertir el lienzo a imagen JPG
    const datosImagen = lienzoQR.toDataURL("image/jpeg", 0.95);

    // Mostrar una vista previa pequeña dentro de la tarjeta
    imagenPreviaQR.src = datosImagen;
    previaQR.style.display = "block";

    // Descargar automáticamente el archivo JPG al dispositivo
    const enlaceDescarga = document.createElement("a");
    enlaceDescarga.href = datosImagen;
    enlaceDescarga.download = "QR_" + (idAlumno || "alumno") + ".jpg";
    document.body.appendChild(enlaceDescarga);
    enlaceDescarga.click();
    document.body.removeChild(enlaceDescarga);

}

</script>


</body>

</html>
